```html

      rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  font-family:'Poppins',sans-serif;

  background:
  linear-gradient(
    135deg,
    #0f172a,
    #111827
  );

  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:20px;

  color:white;
}

.card{

  width:100%;
  max-width:460px;

  background:
  rgba(255,255,255,0.08);

  backdrop-filter:blur(20px);

  border:
  1px solid rgba(255,255,255,0.12);

  border-radius:28px;

  padding:24px;

  box-shadow:
  0 10px 40px rgba(0,0,0,0.35);

  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:20px;
}

.title{

  font-size:24px;
  font-weight:700;
}

.settings-btn{

  width:46px;
  height:46px;

  border:none;
  border-radius:14px;

  background:
  rgba(255,255,255,0.1);

  color:white;

  font-size:20px;

  cursor:pointer;

  transition:0.2s;
}

.settings-btn:hover{

  transform:scale(1.05);
}

.settings-panel{

  display:none;

  margin-bottom:20px;

  background:
  rgba(255,255,255,0.06);

  border-radius:20px;

  padding:18px;
}

.setting-group{

  margin-bottom:16px;
}

.setting-label{

  display:block;

  margin-bottom:8px;

  font-size:14px;

  color:#cbd5e1;
}

.custom-select,
.setting-input{

  width:100%;

  padding:14px 16px;

  border:none;
  border-radius:14px;

  background:
  rgba(255,255,255,0.08);

  color:white;

  font-size:15px;

  outline:none;

  border:
  1px solid rgba(255,255,255,0.08);

</head>

<body>

<div class="card">

  <div class="topbar">

    <div class="title">
      Brain Trainer
    </div>

    <button class="settings-btn"
            onclick="toggleSettings()">
      ⚙
    </button>

  </div>

  <div class="settings-panel"
       id="settingsPanel">

    <div class="setting-group">

      <label class="setting-label">
        Quiz Type
      </label>

      <select id="quizType"
              class="custom-select">

        <option value="alphaToNum">
          Alphabet → Number
        </option>

        <option value="numToAlpha">
          Number → Alphabet
        </option>

        <option value="multiply">
          Multiplication
        </option>

        <option value="multiplyReverse">
          Reverse Multiplication
        </option>

        <option value="square">
          Squares
        </option>

        <option value="cube">
          Cubes
        </option>

      </select>

    </div>

    <div class="setting-group">

      <label class="setting-label">
        Timer (seconds)
      </label>

      <input type="number"
             id="timerInput"
             class="setting-input"
             value="10"
             min="1"
             max="60">

    </div>

    <div class="setting-group">

      <label class="setting-label">
        Multiplication Range
      </label>

      <div class="range-grid">

        <input type="number"
               id="rangeA"
               class="setting-input"
               value="30"
               min="1"
               placeholder="A Max">

        <input type="number"
               id="rangeB"
               class="setting-input"
               value="30"
               min="1"
               placeholder="B Max">

      </div>

    </div>

    <button class="save-btn"
            onclick="saveSettings()">

      Save Settings

    </button>

  </div>

  <div class="timer-top">

    <span>Time Left</span>

    <span id="timerText">
      10s
    </span>

  </div>

  <div class="progress">

    <div class="progress-bar"
         id="progressBar">
    </div>

  </div>

  <div class="question"
       id="question">
  </div>

  <input type="text"
         id="answer"
         class="answer"
         placeholder="Type answer">

  <button class="submit"
          onclick="submitAnswer()">

    Submit

  </button>

  <div class="feedback"
       id="feedback">
  </div>

  <div class="stats">

    <div class="stat">

      <div class="stat-value"
           id="correctCount">
        0
      </div>

      <div class="stat-label">
        Correct
      </div>

    </div>

    <div class="stat">

      <div class="stat-value"
           id="totalCount">
        0
      </div>

      <div class="stat-label">
        Total
      </div>

    </div>

  </div>

</div>

<script>

let currentAnswer = "";

let correct = 0;
let total = 0;

let timer;
let timeLeft;

let answered = false;

let quizType = "alphaToNum";

let quizTime = 10;

let maxA = 30;
let maxB = 30;

function toggleSettings(){

  const panel =
  document.getElementById("settingsPanel");

  panel.style.display =
  panel.style.display === "block"
  ? "none"
  : "block";
}

function saveSettings(){

  quizType =
  document.getElementById("quizType").value;

  quizTime =
  parseInt(
    document.getElementById("timerInput").value
  );

  maxA =
  parseInt(
    document.getElementById("rangeA").value
  ) || 30;

  maxB =
  parseInt(
    document.getElementById("rangeB").value
  ) || 30;

  toggleSettings();

  generateQuestion();
}

function generateQuestion(){

  clearInterval(timer);

  answered = false;

  document.getElementById("answer").value = "";

  document.getElementById("answer").focus();

  document.getElementById("feedback").innerText = "";

  let q = "";

  if(quizType === "alphaToNum"){

    const letter =
    String.fromCharCode(
      65 + Math.floor(Math.random()*26)
    );

    currentAnswer =
    letter.charCodeAt(0) - 64;

    q =
    `What number is<br>
    <span class="big">${letter}</span>`;
  }

  else if(quizType === "numToAlpha"){

    const number =
    Math.floor(Math.random()*26)+1;

    currentAnswer =
    String.fromCharCode(64 + number);

    q =
    `Which alphabet is<br>
    <span class="big">${number}</span>`;
  }

  else if(quizType === "multiply"){

    const a =
    Math.floor(Math.random()*maxA)+1;

    const b =
    Math.floor(Math.random()*maxB)+1;

    currentAnswer = a*b;

    q =
    `<span class="big">
    ${a} × ${b}
    </span><br>= ?`;
  }

  else if(quizType === "multiplyReverse"){

    const a =
    Math.floor(Math.random()*maxA)+1;

    const b =
    Math.floor(Math.random()*maxB)+1;

    currentAnswer =
    `${a},${b}`;

    const result = a*b;

    q =
    `? × ? =<br>
    <span class="big">
    ${result}
    </span>
    <br>
    <span style="
    font-size:14px;
    color:#94a3b8;">
    Enter as: a,b
    </span>`;
  }

  else if(quizType === "square"){

    const n =
    Math.floor(Math.random()*30)+1;

    currentAnswer = n*n;

    q =
    `<span class="big">
    ${n}²
    </span><br>= ?`;
  }

  else if(quizType === "cube"){

    const n =
    Math.floor(Math.random()*30)+1;

    currentAnswer = n*n*n;

    q =
    `<span class="big">
    ${n}³
    </span><br>= ?`;
  }

  document.getElementById("question")
  .innerHTML = q;

  startTimer();
}

function startTimer(){

  timeLeft = quizTime;

  updateTimerUI();

  timer = setInterval(()=>{

    timeLeft--;

    updateTimerUI();

    if(timeLeft <= 0){

      clearInterval(timer);

      if(!answered){

        answered = true;

        total++;

        updateStats();

        showFeedback(
          `⏰ Answer: ${currentAnswer}`,
          "#f59e0b"
        );

        setTimeout(
          generateQuestion,
          1500
        );
      }
    }

  },1000);
}

function updateTimerUI(){

  document.getElementById("timerText")
  .innerText =
  `${timeLeft}s`;

  const width =
  (timeLeft / quizTime) * 100;

  document.getElementById("progressBar")
  .style.width =
  width + "%";
}

function submitAnswer(){

  if(answered) return;

  answered = true;

  clearInterval(timer);

  const userAnswer =
  document.getElementById("answer")
  .value
  .trim()
  .toUpperCase();

  total++;

  if(userAnswer ==
     currentAnswer.toString().toUpperCase()){

    correct++;

    showFeedback(
      "✅ Correct",
      "#22c55e"
    );

  }else{

    showFeedback(
      `❌ Correct: ${currentAnswer}`,
      "#ef4444"
    );
  }

  updateStats();

  setTimeout(
    generateQuestion,
    1500
  );
}

function showFeedback(text,color){

  const feedback =
  document.getElementById("feedback");

  feedback.innerText = text;

  feedback.style.color = color;
}

function updateStats(){

  document.getElementById("correctCount")
  .innerText = correct;

  document.getElementById("totalCount")
  .innerText = total;
}

document
.getElementById("answer")
.addEventListener("keydown",(e)=>{

  if(e.key === "Enter"){

    submitAnswer();
  }
});

generateQuestion();

</script>

</body>
</html>
